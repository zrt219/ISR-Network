[profile.default]
src             = "src"
out             = "out"
libs            = ["lib"]
test            = "test"
script          = "script"
solc            = "0.8.24"
optimizer       = true
optimizer_runs  = 200
via_ir          = false
evm_version     = "london"

gas_price       = 100_000_000_000
gas_limit       = 300_000
